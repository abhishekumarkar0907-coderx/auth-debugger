[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "auth-engine"
version = "0.1.0"
description = "Deterministic confused-deputy authorization analysis engine"
requires-python = ">=3.11"
# Zero runtime dependencies — pure Python security engine
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
